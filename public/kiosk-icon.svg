<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Barangay Abuno Public Kiosk">
  <!--
    Kiosk app icon.

    Deliberately typographic rather than a drawn emblem: the project has a
    real Barangay Abuno mark (public/Abunoi.jpg), and inventing a second
    seal-shaped graphic next to it would misrepresent the office. This is
    the hall's own colours plus its initials, and the manifest also ships
    the actual photograph as an icon entry.
  -->
  <rect width="512" height="512" rx="96" fill="#0E2F5C"/>
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="#F0CE7E" stroke-width="8"/>
  <text
    x="256"
    y="316"
    text-anchor="middle"
    font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="228"
    font-weight="800"
    letter-spacing="-8"
    fill="#F0CE7E"
  >AB</text>
  <rect x="176" y="356" width="160" height="10" rx="5" fill="#FFFFFF" opacity="0.85"/>
</svg>
